name: Native tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation-imageio:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Capture result selection
        run: bash tests/run_capture_result_native.sh
      - name: Error serialization
        run: bash tests/run_error_details_native.sh
      - name: Storage
        run: bash tests/run_storage_native.sh
      - name: JPEG and metadata
        run: bash tests/run_jpeg_native.sh
      - name: Video reframe geometry
        run: bash tests/run_video_reframe_native.sh
      - name: Video recorder state
        run: bash tests/run_video_recorder_native.sh
      - name: Subject tracker state
        run: bash tests/run_subject_tracker_native.sh
      - name: Remote control server
        run: bash tests/run_remote_server_native.sh
      - name: Webcam crop and JPEG encoder
        run: bash tests/run_webcam_encoder_native.sh
      - name: Webcam MJPEG server
        run: bash tests/run_webcam_server_native.sh
      - name: OpenSSH package and service status
        run: bash tests/run_openssh_status_native.sh
      - name: QR pairing validation and Vision recognition
        run: bash tests/run_pairing_manager_native.sh
      - name: Core math
        run: python3 -m unittest discover -s tests -v
